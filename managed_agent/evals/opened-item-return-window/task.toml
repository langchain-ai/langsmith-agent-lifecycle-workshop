schema_version = "1.3"

[task]
name = "techhub-support/opened-item-return-window"
description = "A customer asks whether an opened item delivered 20 days ago can be returned"

[metadata]
category = "techhub-support"
tags = ["policy", "grounding", "sandbox"]
# PASS RULE: names the 14-day opened-item window, says not eligible, and never says the return is allowed.
# Mentioning the defect or warranty route is a stat only.
# INVALID RUN: no /logs/agent/result.json -> verify.py exits 2 and writes invalid.txt.

[agent]
timeout_sec = 600.0

[verifier]
timeout_sec = 60.0

[environment]
build_timeout_sec = 900.0
workdir = "/app"
cpus = 2
memory_mb = 4096

[environment.env]
# In eval mode the file tools are rooted at /app, so setup.sh puts the docs where the
# agent's "/workspace/techhub/..." paths resolve (see sandbox/setup.sh).
TECHHUB_SANDBOX_ROOT = "/app/workspace"
