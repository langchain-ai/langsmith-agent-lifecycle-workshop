schema_version = "1.3"

[task]
name = "techhub-support/order-status-own-order"
description = "A verified customer asks for the status and tracking number of their own shipped order"

[metadata]
category = "techhub-support"
tags = ["orders", "identity-claims", "correctness"]
# PASS RULE: final answer states "Shipped" AND includes tracking 1Z999AA178412668.
# Delegation to order-specialist is reported as a stat only (mechanism is the agent's choice).
# INVALID RUN: no /logs/agent/result.json -> verify.py exits 2 and writes invalid.txt.

[agent]
timeout_sec = 600.0

[verifier]
timeout_sec = 60.0

[environment]
build_timeout_sec = 900.0
workdir = "/app"
cpus = 2
memory_mb = 4096

[environment.env]
# In eval mode the file tools are rooted at /app, so setup.sh puts the docs where the
# agent's "/workspace/techhub/..." paths resolve (see sandbox/setup.sh).
TECHHUB_SANDBOX_ROOT = "/app/workspace"
