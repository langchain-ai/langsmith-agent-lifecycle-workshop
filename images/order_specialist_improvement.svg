<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" font-family="Helvetica, Arial, sans-serif">
  <title>Order specialist improvement: five rigid lookup tools replaced by one customer-scoped SQL tool</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="context-stroke" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#888" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#222" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="760" height="640" fill="#ffffff"/>

  <!-- OLD / New labels -->
  <text x="110" y="200" font-size="32" font-weight="bold" fill="#d93a3a" text-anchor="middle">OLD</text>
  <text x="110" y="510" font-size="32" font-weight="bold" fill="#2f9e44" text-anchor="middle">New</text>
  <path d="M 112 215 C 60 300, 60 400, 108 470" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#arrow-dark)"/>

  <!-- OLD panel -->
  <rect x="200" y="20" width="540" height="285" fill="#f1f7fd" stroke="#999" stroke-width="1.5"/>
  <text x="216" y="50" font-size="18" fill="#888">order-specialist (subagent)</text>
  <polygon points="300,105 360,175 300,245 240,175" fill="#fff" stroke="#888" stroke-width="2" stroke-linejoin="round"/>
  <text x="300" y="181" font-size="17" fill="#888" text-anchor="middle">LLM</text>
  <rect x="490" y="70" width="230" height="215" rx="18" fill="#fff" stroke="#888" stroke-width="2"/>
  <text x="605" y="96" font-size="18" fill="#888" text-anchor="middle">Tools</text>
  <g font-family="Menlo, Consolas, monospace" font-size="13" fill="#888">
    <text x="508" y="130">get_order_status()</text>
    <text x="508" y="160">get_order_items()</text>
    <text x="508" y="190">get_product_info()</text>
    <text x="508" y="220">get_order_item_price()</text>
    <text x="508" y="250">get_customer_orders()</text>
  </g>
  <path d="M 345 125 C 400 85, 440 90, 484 112" fill="none" stroke="#888" stroke-width="1.8" stroke-dasharray="3 5" marker-end="url(#arrow-grey)"/>
  <path d="M 484 240 C 430 280, 380 270, 340 228" fill="none" stroke="#888" stroke-width="1.4" marker-end="url(#arrow-grey)"/>

  <!-- NEW panel -->
  <rect x="200" y="330" width="540" height="285" fill="#e3f0fb" stroke="#333" stroke-width="1.5"/>
  <text x="216" y="360" font-size="18" fill="#222">order-specialist (subagent)</text>
  <polygon points="300,415 360,485 300,555 240,485" fill="#fff" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
  <text x="300" y="491" font-size="17" fill="#222" text-anchor="middle">LLM</text>
  <rect x="490" y="380" width="230" height="215" rx="18" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="605" y="406" font-size="18" fill="#222" text-anchor="middle">Tools</text>
  <text x="605" y="484" font-family="Menlo, Consolas, monospace" font-size="13" fill="#222" text-anchor="middle">query_my_orders(sql)</text>
  <text x="605" y="514" font-size="12" font-style="italic" fill="#555" text-anchor="middle">runs only over the verified</text>
  <text x="605" y="530" font-size="12" font-style="italic" fill="#555" text-anchor="middle">customer's rows</text>
  <path d="M 345 435 C 400 395, 440 400, 484 422" fill="none" stroke="#222" stroke-width="1.8" stroke-dasharray="3 5" marker-end="url(#arrow-dark)"/>
  <path d="M 484 550 C 430 590, 380 580, 340 538" fill="none" stroke="#222" stroke-width="1.4" marker-end="url(#arrow-dark)"/>
</svg>
